{% extends "base.html" %}
{% block title %}Add menu item | Café Calle Ocho{% endblock %}
{% block content %}
<h1>Add menu item</h1>
<p>Staff menu management. Prices are entered in dollars.</p>
{% if error %}<p role="alert">{{ error }}</p>{% endif %}
<form method="post" action="{{ url_for('menu_new') }}">
  <label for="name">Name</label>
  <input id="name" name="name" required value="{{ request.form.get('name', '') }}">
  <label for="category">Category</label>
  <select id="category" name="category">
    {% for value in ['coffee', 'bakery', 'snacks'] %}
    <option value="{{ value }}" {% if request.form.get('category', 'coffee') == value %}selected{% endif %}>{{ value|title }}</option>
    {% endfor %}
  </select>
  <label for="price">Price (USD)</label>
  <input id="price" name="price" type="number" min="0" max="999999.99" step="0.01" required value="{{ request.form.get('price', '') }}">
  <label for="description">Description</label>
  <textarea id="description" name="description">{{ request.form.get('description', '') }}</textarea>
  <label><input name="available" type="checkbox" value="1" {% if request.method == 'GET' or request.form.get('available') == '1' %}checked{% endif %}>Available</label>
  <label><input name="supports_milk" type="checkbox" value="1" {% if request.form.get('supports_milk') == '1' %}checked{% endif %}>Supports milk options</label>
  <button type="submit">Save menu item</button>
</form>
<p><a href="{{ url_for('menu') }}">Back to Menu</a></p>
{% endblock %}
